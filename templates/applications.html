<!-- applications.html -->
<div class="resource-page">
    {% include '_resource_page_styles.html' %}
    <!-- Header for Applications -->
    <header class="page-toolbar flex justify-between items-center mb-4">
        <!-- Navigation Tabs -->
        <nav class="flex flex-wrap gap-3 text-gray-700">
            <a href="/applications" data-page="applications" class="tab-link primary-action btn btn-primary group active justify-start py-3 text-left">
                <svg class="h-5 w-5 flex-shrink-0 text-yellow-500 group-hover:text-yellow-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-2.25-1.313M21 7.5v2.25m0-2.25-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3 2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75 2.25-1.313M12 21.75V19.5m0 2.25-2.25-1.313m0-16.875L12 2.25l2.25 1.313M21 14.25v2.25l-2.25 1.313m-13.5 0L3 16.5v-2.25" />
                </svg>
                Applications
            </a>
            <a href="/projects" data-page="projects" class="tab-link primary-action btn btn-secondary group justify-start py-3 text-left">
                <svg class="h-5 w-5 flex-shrink-0 text-yellow-500 group-hover:text-yellow-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 0 0-1.883 2.542l.857 6a2.25 2.25 0 0 0 2.227 1.932H19.05a2.25 2.25 0 0 0 2.227-1.932l.857-6a2.25 2.25 0 0 0-1.883-2.542m-16.5 0V6A2.25 2.25 0 0 1 6 3.75h3.879a1.5 1.5 0 0 1 1.06.44l2.122 2.12a1.5 1.5 0 0 0 1.06.44H18A2.25 2.25 0 0 1 20.25 9v.776" />
                </svg>
                Projects
            </a>
        </nav>
        <div class="toolbar-actions flex items-center space-x-4">
            <form id="searchForm" class="toolbar-search relative">
                <input
                    class="focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 focus:outline-none
                           w-full text-sm text-black placeholder-gray-500 border border-gray-200
                           rounded-md py-2 pl-10"
                    type="text"
                    name="search"
                    placeholder="Search applications..."
                    value=""
                />
                <svg
                    width="20"
                    height="20"
                    fill="currentColor"
                    class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                >
                    <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2
                           8a6 6 0 1110.89 3.476l4.817
                           4.817a1 1 0 01-1.414
                           1.414l-4.816-4.816A6
                           6 0 012 8z"
                    />
                </svg>
            </form>
            {% if can_create_application %}
                <button
                    onclick="openModal()"
                    class="primary-action btn btn-primary group"
                >
                    <svg
                        class="flex-shrink-0 text-current"
                        width="12"
                        height="20"
                        fill="currentColor"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M6 5a1 1 0 011 1v3h3a1 1 0 110
                               2H7v3a1 1 0 11-2
                               0v-3H2a1 1 0 110-2h3V6a1 1
                               0 011-1z"
                        />
                    </svg>
                    New Application
                </button>
            {% endif %}
        </div>
    </header>

    <!-- Application List -->
    <div class="flex flex-col" style="min-height: 500px;">
        <div id="appListContainer" class="flex-grow">
            <!-- Application list will be loaded here via AJAX -->
        </div>

        <!-- Pagination Controls -->
        <div id="paginationControls" class="flex flex-wrap justify-between items-center mt-4">
            <button
                id="prevPage"
                class="pagination-button btn btn-secondary"
            >
                ← Previous
            </button>
            <div id="pageNumbers" class="flex items-center space-x-1">
                <!-- Page numbers will be inserted here -->
            </div>
            <button
                id="nextPage"
                class="pagination-button btn btn-secondary"
            >
                Next →
            </button>
        </div>
    </div>

    <!-- New Application Modal -->
    <div
        id="myModal"
        class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-800 bg-opacity-75 flex justify-center items-center"
    >
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-auto overflow-hidden">
            <!-- Modal Header -->
            <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-100">
                <h3 class="text-lg font-bold text-gray-800">Create Application</h3>
                <button
                    class="close-modal text-gray-400 hover:text-gray-600 focus:outline-none"
                    onclick="closeModal()"
                >
                    <svg
                        class="w-6 h-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12
                               12"
                        />
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-4">
                <form id="createForm">
                    <div class="mb-4">
                        <label
                            for="name"
                            class="block text-sm font-medium text-gray-700"
                        >
                            Application Name
                        </label>
                        <input
                            type="text"
                            name="name"
                            id="name"
                            class="form-input mt-1 block w-full focus:border-yellow-500 focus:outline-none focus:ring-1 focus:ring-yellow-500"
                            required
                        />
                    </div>

                    <!-- Dropdown for Project, with filter -->
                    <div class="mb-4">
                        <label
                            id="projectDropdownLabel"
                            class="block text-sm font-medium text-gray-700"
                        >
                            Project
                        </label>
                        <div class="relative mt-1">
                            <button
                                type="button"
                                id="projectDropdownButton"
                                class="relative w-full cursor-default rounded-md border
                                       border-gray-300 bg-white py-2 pl-3 pr-10 text-left
                                       shadow-sm focus:border-yellow-500 focus:outline-none
                                       focus:ring-1 focus:ring-yellow-500 sm:text-sm"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                            >
                                <span
                                    class="block truncate"
                                    id="projectDropdownSelected"
                                >
                                    Select Project
                                </span>
                                <span
                                    class="pointer-events-none absolute inset-y-0 right-0 flex
                                           items-center pr-2"
                                >
                                    <svg
                                        class="h-5 w-5 text-gray-400"
                                        viewBox="0 0 20 20"
                                        fill="currentColor"
                                        aria-hidden="true"
                                    >
                                        <path
                                            fill-rule="evenodd"
                                            d="M5.23 7.21a.75.75
                                               0 011.06.02L10 10.94l3.71-3.71a.75.75
                                               0 111.06
                                               1.06l-4.24
                                               4.24a.75.75
                                               0
                                               01-1.06
                                               0L5.23
                                               8.27a.75.75
                                               0
                                               01.02-1.06z"
                                            clip-rule="evenodd"
                                        />
                                    </svg>
                                </span>
                            </button>

                            <!-- Dropdown Panel -->
                            <div
                                id="projectDropdownPanel"
                                class="absolute z-50 mt-1 w-full hidden rounded-md bg-white
                                       shadow-lg ring-1 ring-black ring-opacity-5
                                       focus:outline-none"
                                role="listbox"
                                aria-labelledby="projectDropdownLabel"
                            >
                                <!-- Filter box -->
                                <div class="p-2 border-b border-gray-200">
                                    <input
                                        type="text"
                                        id="projectSearchInput"
                                        class="w-full rounded-md border border-gray-300 px-2 py-1
                                               text-sm focus:border-yellow-500 focus:ring-1
                                               focus:ring-yellow-500"
                                        placeholder="Type to filter..."
                                    />
                                </div>
                                <ul
                                    id="projectList"
                                    class="max-h-48 overflow-auto py-1 text-base sm:text-sm"
                                >
                                </ul>
                            </div>
                        </div>
                        <input
                            type="hidden"
                            id="selectedProjectId"
                            name="project_ids"
                            value=""
                        />
                        <p id="projectRequiredNote" class="mt-2 hidden text-sm text-gray-500">
                            Create a project first, then add applications to it.
                        </p>
                    </div>

                    <div class="mb-4">
                        <label
                            for="link"
                            class="block text-sm font-medium text-gray-700"
                        >
                            Git Repository URL:
                        </label>
                        <input
                            type="url"
                            name="link"
                            id="link"
                            class="form-input mt-1 block w-full focus:border-yellow-500 focus:outline-none focus:ring-1 focus:ring-yellow-500"
                        />
                    </div>
                    <div class="mb-4">
                        <label
                            for="label"
                            class="block text-sm font-medium text-gray-700"
                        >
                            Label
                        </label>
                        <input
                            type="text"
                            name="label"
                            id="label"
                            class="form-input mt-1 block w-full focus:border-yellow-500 focus:outline-none focus:ring-1 focus:ring-yellow-500"
                        />
                    </div>
                </form>
            </div>

            <!-- Modal Footer (gray bottom, akin to newProjectModal style) -->
            <div class="p-4 border-t border-gray-200 bg-gray-100 text-right rounded-b-lg">
                <button
                    type="submit"
                    form="createForm"
                    class="btn btn-primary"
                >
                    Create Application
                </button>
            </div>
        </div>
    </div>
</div>


<!-- Main JavaScript for this page -->
<script>
(function() {
    let appsData = [];
    let currentPage = 1;
    const appsPerPage = 5;
    let appSortKey = 'id';
    let appSortDirection = 'asc';

    // ================== SweetAlert Helpers ==================
    function getButtonClass(icon, type) {
        // same logic as your snippet
        switch (icon) {
            case 'success':
                return (type === 'confirm'
                    ? 'btn btn-success'
                    : 'btn btn-secondary');
            case 'error':
                return (type === 'confirm'
                    ? 'btn btn-danger'
                    : 'btn btn-secondary');
            case 'warning':
                return (type === 'confirm'
                    ? 'btn btn-primary'
                    : 'btn btn-secondary');
            case 'info':
            default:
                return (type === 'confirm'
                    ? 'btn btn-info'
                    : 'btn btn-secondary');
        }
    }

    function showSwalModal({ title, text, icon, confirmText, cancelText, onConfirm }) {
        Swal.fire({
            title: title || '',
            text: text || '',
            icon: icon || 'info',
            showCancelButton: !!cancelText,
            confirmButtonText: confirmText || 'OK',
            cancelButtonText: cancelText || 'Cancel',
            customClass: {
                popup: 'resource-page-swal bg-white rounded-lg shadow-lg',
                title: 'text-xl font-bold text-gray-800',
                content: 'text-gray-700',
                confirmButton: getButtonClass(icon, 'confirm'),
                cancelButton: getButtonClass(icon, 'cancel'),
                actions: 'flex justify-center space-x-4'
            },
            buttonsStyling: false,
            scrollbarPadding: false
        }).then((result) => {
            if (result.isConfirmed && typeof onConfirm === 'function') {
                onConfirm();
            }
        });
    }

    // ============== Load & Display Applications ==============
    function loadAppsData(searchQuery = '') {
        $('#appListContainer').html('<div class="flex justify-center items-center py-20"><div class="spinner"></div></div>');
        $.ajax({
            url: '/get_applications_data',
            type: 'GET',
            data: { search: searchQuery },
            success: function(data) {
                appsData = data;
                currentPage = 1;
                displayApps(currentPage);
                updatePaginationControls();
            },
            error: function() {
                $('#appListContainer').html('Error loading applications.');
            }
        });
    }

    function displayApps(page) {
        let startIndex = (page - 1) * appsPerPage;
        let endIndex = startIndex + appsPerPage;
        let appsToShow = sortedAppsData().slice(startIndex, endIndex);

        let appListHtml = `
            <div class="responsive-table-wrap bg-white shadow-md rounded-lg border border-gray-200 my-6">
                <table class="responsive-table text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="col-id w-16 py-4 px-6 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                                ${appSortHeader('id', 'ID')}
                            </th>
                            <th class="py-4 px-6 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                                ${appSortHeader('name', 'Name')}
                            </th>
                            <th class="hide-sm w-48 whitespace-nowrap py-4 px-6 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                                Latest Version
                            </th>
                            <th class="hide-sm w-56 whitespace-nowrap py-4 px-5 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                                ${appSortHeader('release_date', 'Release Date')}
                            </th>
                            <th class="col-access whitespace-nowrap py-4 px-6 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                                Access
                            </th>
                            <th class="col-actions w-32 py-4 px-6 bg-gray-100 font-bold uppercase text-sm text-gray-600 border-b border-gray-200">
                            </th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        appsToShow.forEach(function(app) {
            let appName = app.name || '';
            let truncatedName = (appName.length > 20)
                ? appName.substring(0, 20) + '…'
                : appName;

            let dateStr = app.change_date || 'N/A';
            let dateTitle = app.change_datetime || dateStr;
            const accessClass = app.access_code === 'RW'
                ? 'bg-green-100 text-green-700 border-green-200'
                : 'bg-gray-100 text-gray-700 border-gray-200';
            const deleteButton = app.can_edit ? `
                            <button
                                class="delete-button table-action-button"
                                data-id="${app.id}"
                                aria-label="Delete Application"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    class="w-6 h-6"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="m14.74
                                           9-.346
                                           9m-4.788
                                           0L9.26
                                           9m9.968-3.21c.342.052.682.107
                                           1.022.166m-1.022-.165L18.16
                                           19.673a2.25
                                           2.25
                                           0
                                           0
                                           1-2.244
                                           2.077H8.084a2.25
                                           2.25
                                           0
                                           0
                                           1-2.244-2.077L4.772
                                           5.79m14.456
                                           0a48.108
                                           48.108
                                           0
                                           0
                                           0-3.478-.397m-12
                                           .562c.34-.059.68-.114
                                           1.022-.165m0
                                           0a48.11
                                           48.11
                                           0
                                           0
                                           1
                                           3.478-.397m7.5
                                           0v-.916c0-1.18-.91-2.164-2.09-2.201
                                           a51.964
                                           51.964
                                           0
                                           0
                                           0-3.32
                                           0c-1.18.037-2.09
                                           1.022-2.09
                                           2.201v.916m7.5
                                           0a48.667
                                           48.667
                                           0
                                           0
                                           0-7.5
                                           0"
                                    />
                                </svg>
                            </button>
            ` : '<span class="table-action-button invisible"></span>';

            appListHtml += `
                <tr class="hover:bg-gray-50 cursor-pointer app-row" data-id="${app.id}">
                    <td class="col-id text-lg text-gray-600 py-4 px-6 border-b border-gray-200">
                        <span class="inline-block bg-gray-200 text-gray-800 rounded-full px-3 py-1 text-sm font-semibold">
                            ${app.id}
                        </span>
                    </td>
                    <td class="text-base text-gray-600 py-4 px-6 border-b border-gray-200">
                        <a
                            href="#"
                            class="app-details-link responsive-name-link text-gray-800 hover:text-yellow-700 hover:underline"
                            data-id="${app.id}"
                            title="${appName}"
                        >
                            ${truncatedName}
                        </a>
                    </td>
                    <td class="hide-sm whitespace-nowrap text-base py-4 px-6 border-b border-gray-200">
                        <span>${app.version_info || 'N/A'}</span>
                    </td>
                    <td class="date-time-text hide-sm whitespace-nowrap text-sm text-gray-600 py-4 px-5 border-b border-gray-200" title="${dateTitle}">
                        ${dateStr}
                    </td>
                    <td class="col-access whitespace-nowrap text-base text-gray-600 py-4 px-6 border-b border-gray-200">
                        <span class="inline-flex items-center rounded-md border px-2.5 py-1 text-xs font-semibold ${accessClass}">
                            ${app.access_code || ''}
                        </span>
                    </td>
                    <td class="col-actions text-base text-gray-600 py-4 px-6 border-b border-gray-200">
                        <div class="table-actions">
                            <!-- Details Button -->
                            <button
                                class="app-details-link table-action-button"
                                data-id="${app.id}"
                                aria-label="View Application Details"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    class="w-6 h-6"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                                    />
                                </svg>
                            </button>

                            ${deleteButton}
                        </div>
                    </td>
                </tr>
            `;
        });

        appListHtml += `
                    </tbody>
                </table>
            </div>
        `;

        $('#appListContainer').html(appListHtml);

        // Re-attach event handlers
        $('.delete-button').off('click').on('click', function(e) {
            e.stopPropagation();
            const appId = $(this).data('id');
            showSwalModal({
                title: 'Are you sure?',
                text: "This will permanently delete the application.",
                icon: 'warning',
                confirmText: 'Yes, delete it!',
                cancelText: 'Cancel',
                onConfirm: function() {
                    deleteApplication(appId);
                }
            });
        });

        $('.app-details-link').off('click').on('click', function(e) {
            e.preventDefault();
            const appId = $(this).data('id');
            window.loadPage('application_details', appId);
        });

        $('#appListContainer .app-row').off('click').on('click', function(e) {
            if ($(e.target).closest('button, a, input, select, textarea, label').length) return;
            window.loadPage('application_details', Number($(this).data('id')));
        });

        $('#appListContainer .app-sort-button').off('click').on('click', function() {
            const nextSortKey = $(this).data('sort-key');
            appSortDirection = appSortKey === nextSortKey && appSortDirection === 'asc'
                ? 'desc'
                : 'asc';
            appSortKey = nextSortKey;
            currentPage = 1;
            displayApps(currentPage);
            updatePaginationControls();
        });
    }

    function appSortHeader(key, label) {
        const active = appSortKey === key;
        return `
            <button type="button" class="table-sort-button app-sort-button" data-sort-key="${key}">
                <span>${label}</span>
                <span class="table-sort-indicator" aria-hidden="true">${sortIndicatorSvg(active ? appSortDirection : 'neutral')}</span>
            </button>
        `;
    }

    function sortIndicatorSvg(direction) {
        if (direction === 'asc') {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="table-sort-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
                </svg>
            `;
        }
        if (direction === 'desc') {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="table-sort-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            `;
        }
        return `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="table-sort-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
            </svg>
        `;
    }

    function sortedAppsData() {
        const multiplier = appSortDirection === 'asc' ? 1 : -1;
        return appsData.slice().sort(function(left, right) {
            let leftValue = '';
            let rightValue = '';

            if (appSortKey === 'id') {
                leftValue = Number(left.id) || 0;
                rightValue = Number(right.id) || 0;
            } else if (appSortKey === 'name') {
                leftValue = (left.name || '').toLowerCase();
                rightValue = (right.name || '').toLowerCase();
            } else if (appSortKey === 'release_date') {
                leftValue = left.change_sort || '';
                rightValue = right.change_sort || '';
            }

            if (leftValue < rightValue) return -1 * multiplier;
            if (leftValue > rightValue) return 1 * multiplier;
            return 0;
        });
    }

    function updatePaginationControls() {
        let totalPages = Math.ceil(appsData.length / appsPerPage);
        $('#pageNumbers').html('');

        // Show/hide prev
        if (currentPage === 1) {
            $('#prevPage').addClass('invisible');
        } else {
            $('#prevPage').removeClass('invisible');
        }
        // Show/hide next
        if (currentPage === totalPages || totalPages === 0) {
            $('#nextPage').addClass('invisible');
        } else {
            $('#nextPage').removeClass('invisible');
        }

        // Prev click
        $('#prevPage').off('click').on('click', function() {
            if (currentPage > 1) {
                currentPage--;
                displayApps(currentPage);
                updatePaginationControls();
            }
        });
        // Next click
        $('#nextPage').off('click').on('click', function() {
            if (currentPage < totalPages) {
                currentPage++;
                displayApps(currentPage);
                updatePaginationControls();
            }
        });

        // Page number logic
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage < maxVisiblePages - 1) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let page = startPage; page <= endPage; page++) {
            $('#pageNumbers').append(`
                <span
                    class="cursor-pointer inline-flex items-center justify-center w-8 h-8
                    ${page === currentPage
                        ? 'pagination-page-active'
                        : 'pagination-page-inactive'}
                    rounded-full"
                    onclick="goToPage(${page})"
                >
                    ${page}
                </span>
            `);
        }
    }

    function goToPage(page) {
        currentPage = page;
        displayApps(page);
        updatePaginationControls();
    }
    window.goToPage = goToPage;

    // DELETE APPLICATION
    function deleteApplication(appId) {
        $.ajax({
            url: `/delete_application/${appId}`,
            type: 'DELETE',
            success: function(response) {
                showSwalModal({
                    title: 'Deleted!',
                    text: response.message,
                    icon: 'success',
                    confirmText: 'OK',
                    onConfirm: function() {
                        loadAppsData();
                    }
                });
            },
            error: function(xhr) {
                const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error deleting application';
                showSwalModal({
                    title: 'Error!',
                    text: `Error: ${error}`,
                    icon: 'error',
                    confirmText: 'OK'
                });
            }
        });
    }

    // =============== Open/Close Modal =================
    window.openModal = function() {
        $('#myModal').removeClass('hidden');
        loadProjectsSingleSelect();
    };
    window.closeModal = function() {
        $('#myModal').addClass('hidden');
        $('#createForm')[0].reset();
        // reset the single select
        $('#projectDropdownSelected').text('Select Project');
        $('#selectedProjectId').val('');
        $('#projectList').empty();
        $('#projectSearchInput').val('');
    };

    // Close modal if user clicks outside the content
    $(document).ready(function() {
        $('#myModal').on('click', function(e) {
            if (e.target.id === 'myModal') {
                closeModal();
            }
        });
    });

    // ================== FORM SUBMISSION ==================
    $(document).ready(function() {
        // 1) Load data
        const pendingSearchQuery = sessionStorage.getItem('applicationSearchQuery') || '';
        if (pendingSearchQuery) {
            sessionStorage.removeItem('applicationSearchQuery');
            $('#searchForm').find('input[name="search"]').val(pendingSearchQuery);
        }
        loadAppsData(pendingSearchQuery);

        // 2) Search form
        $('#searchForm').on('submit', function(e) {
            e.preventDefault();
            let searchQuery = $(this).find('input[name="search"]').val();
            loadAppsData(searchQuery);
        });

        // 3) Submit create form
        $('#createForm').submit(function(e) {
            e.preventDefault();

            // Extra front-end check if user picked a project
            const projectChoice = $('#selectedProjectId').val().trim();
            if (!projectChoice) {
                // If empty, show error message, do not call the API
                showSwalModal({
                    title: 'Validation Error',
                    text: 'Please select a Project before creating the application.',
                    icon: 'error',
                    confirmText: 'OK'
                });
                return;
            }

            const formData = {
                name: $('#name').val().trim(),
                project_ids: [ projectChoice ], // single pick => array if needed
                link: $('#link').val().trim(),
                label: $('#label').val().trim()
            };

            $.ajax({
                url: '/create_application',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(response) {
                    if (response.error) {
                        showSwalModal({
                            title: 'Error!',
                            text: response.error,
                            icon: 'error',
                            confirmText: 'OK'
                        });
                    } else {
                        showSwalModal({
                            title: 'Created!',
                            text: response.message,
                            icon: 'success',
                            confirmText: 'OK',
                            onConfirm: function() {
                                closeModal();
                                loadAppsData();
                            }
                        });
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error creating application';
                    showSwalModal({
                        title: 'Error!',
                        text: `Error: ${error}`,
                        icon: 'error',
                        confirmText: 'OK'
                    });
                }
            });
        });
    });

    // ========== LOAD & FILTER PROJECTS (SINGLE SELECT) ==========
    function loadProjectsSingleSelect() {
        $.ajax({
            url: '/get_projects?access=read_write',
            type: 'GET',
            success: function(allProjects) {
                const projectList = $('#projectList');
                projectList.empty();
                $('#projectRequiredNote').toggleClass('hidden', allProjects.length > 0);
                $('#projectDropdownButton')
                    .prop('disabled', allProjects.length === 0)
                    .toggleClass('cursor-not-allowed opacity-60', allProjects.length === 0);

                if (!allProjects.length) {
                    projectList.append(`
                        <li class="px-3 py-2 text-sm text-gray-500">
                            Create a project first, then add applications to it.
                        </li>
                    `);
                    return;
                }

                // Populate single-select items
                allProjects.forEach(proj => {
                    projectList.append(`
                        <li
                            class="cursor-pointer hover:bg-yellow-100 px-3 py-2 text-sm text-gray-700"
                            data-id="${proj.id}"
                            data-name="${proj.name}"
                        >
                            <span class="truncate">${proj.name}</span>
                        </li>
                    `);
                });

                // Toggle the dropdown on button click
                $('#projectDropdownButton')
                  .off('click')
                  .on('click', function(e) {
                      e.stopPropagation();
                      $('#projectDropdownPanel').toggleClass('hidden');
                  });

                // Close if user clicks away
                $(document).off('click.projectSelect').on('click.projectSelect', function(event) {
                    const panel = $('#projectDropdownPanel');
                    if (!panel.is(event.target)
                        && panel.has(event.target).length === 0
                        && !$('#projectDropdownButton').is(event.target)
                        && $('#projectDropdownButton').has(event.target).length === 0
                    ) {
                        panel.addClass('hidden');
                    }
                });

                // On <li> click => set selection
                $('#projectList li')
                  .off('click')
                  .on('click', function() {
                      const pid = $(this).data('id');
                      const pname = $(this).data('name');
                      $('#projectDropdownPanel').addClass('hidden');
                      $('#projectDropdownSelected').text(pname);
                      $('#selectedProjectId').val(pid);
                  });

                // Filter logic
                $('#projectSearchInput')
                  .off('input')
                  .on('input', function() {
                      const term = $(this).val().toLowerCase();
                      $('#projectList li').each(function() {
                          const name = $(this).data('name').toLowerCase();
                          $(this).toggle(name.includes(term));
                      });
                  });
            },
            error: function(xhr) {
                console.error('Error loading projects: ' + xhr.responseText);
            }
        });
    }
})();
</script>
